<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky 90 Tambola - Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Lucky 90 Tambola - Admin</h1>

<input type="text" id="gameName" placeholder="Game Name">

<input type="number" id="price" placeholder="Ticket Price">

<input type="number" id="tickets" placeholder="Total Tickets">

<input type="date" id="date">

<input type="time" id="time">

<input type="text" id="whatsapp" placeholder="WhatsApp Number">

<button onclick="saveGame()">Save Game</button>

<p id="status"></p>

</div>

<script type="module">
  import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

window.saveGame = async function () {

  const game = {
    name: document.getElementById("gameName").value,
    price: document.getElementById("price").value,
    tickets: document.getElementById("tickets").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    whatsapp: document.getElementById("whatsapp").value,
    createdAt: serverTimestamp()
  };

  try {
    await addDoc(collection(db, "games"), game);

    document.getElementById("status").innerHTML =
      "✅ Game saved successfully!";

  } catch (error) {

    document.getElementById("status").innerHTML =
      "❌ Error: " + error.message;

  }

};
</script>

</body>
</html>
