<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky 90 Tambola - Admin Login</title>
<link rel="stylesheet" href="style.css">
<style>
.login-box{
max-width:350px;
margin:80px auto;
background:white;
color:black;
padding:20px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.3);
}
.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}
.login-box button{
width:100%;
padding:12px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
</style>
</head>
<body>

<header>🎉 Lucky 90 Tambola - Admin</header>

<div class="login-box">
<h2>Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script>
function login(){

let u=document.getElementById("username").value;
let p=document.getElementById("password").value;

if(u==="admin" && p==="12345"){
window.location="admin.html";
}else{
document.getElementById("msg").innerHTML="Invalid Username or Password";
document.getElementById("msg").style.color="red";
}

}
</script>

</body>
</html>
